<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@zbits/ui 组件库演示 · 岩筑 YánZhù</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap');
  @import url('https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css');
  :root {
    --bg-primary:#f2f0eb;--bg-secondary:#e9e6e0;--bg-tertiary:#faf9f6;--bg-card:#faf9f6;
    --bg-input:#f2f0eb;--bg-header:#faf9f6;--bg-code:#e9e6e0;
    --border:#ccc8c0;--border-hover:#9e9a91;--border-strong:#6b675e;
    --rule:#d5d1ca;--rule-light:#e0ddd7;
    --text-primary:#1c1b18;--text-secondary:#5c5850;--text-tertiary:#8e8a80;
    --text-disabled:#b8b4aa;--text-inverse:#f4f2ec;
    --accent:#3a7a6c;--accent-hover:#2c5f54;--accent-light:#e4edeb;--accent-muted:#a8c5be;
    --amber:#b87328;--amber-hover:#9a5f1e;--amber-light:#fdf3e6;
    --success:#4a7a56;--success-light:#eaf2ec;--warning:#8a6a1a;--warning-light:#f5efe2;
    --error:#8a3232;--error-light:#f5e8e8;
    --logo-bg:#2c5f54;--logo-text:#d4e4df;
    --surface-50:#f2f0eb;--surface-100:#e9e6e0;--surface-200:#ddd9d1;--surface-300:#ccc8c0;
    --surface-400:#9e9a91;--surface-500:#8e8a80;--surface-600:#5c5850;--surface-700:#3a3832;--surface-800:#28271f;--surface-900:#1c1b18;
    --shadow-soft:0 1px 0 var(--surface-200);--shadow-float:0 2px 0 var(--surface-300);
    --radius-sm:2px;--radius-md:2px;--radius-lg:3px;
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
    --sp-8:32px;--sp-10:40px;--sp-12:48px;--sp-16:64px;
    --text-xs:11px;--text-sm:12px;--text-base:14px;--text-md:15px;
    --text-lg:18px;--text-xl:20px;--text-2xl:28px;--text-3xl:36px;
    --ease-out:cubic-bezier(0.16,1,0.3,1);--duration-fast:120ms;--duration-normal:200ms;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth;scrollbar-gutter:stable;overflow-y:scroll}
  body{margin:0;padding:0;background:var(--bg-primary);color:var(--text-primary);font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;font-size:var(--text-base);line-height:1.7;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--surface-300)}
  ::webkit-scrollbar-thumb:hover{background:var(--surface-400)}
  ::selection{background:var(--accent-muted);color:var(--surface-900)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,textarea,select{background:var(--bg-input)!important;color:var(--text-primary)!important;border:1px solid var(--border)!important;font-family:inherit!important;transition:border-color 120ms ease!important}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;outline:none!important;box-shadow:inset 0 0 0 1px var(--accent)!important}
  input::placeholder{color:var(--text-disabled)!important;font-style:italic}
  .bg-grid{background-color:var(--bg-primary);background-image:linear-gradient(var(--rule-light) 1px,transparent 1px),linear-gradient(90deg,var(--rule-light) 1px,transparent 1px);background-size:48px 48px}
</style>
</head>
<body>
<script type="text/x-template" id="demo-app-template">
<div class="bg-grid" style="min-height:100vh">
  <!-- Top Nav -->
  <nav class="demo-nav"><div class="demo-nav-inner">
    <a v-for="item in [
        {key:'buttons',label:'ZButton'},{key:'badge',label:'ZBadge'},{key:'card',label:'ZCard'},{key:'modal',label:'ZModal'},
        {key:'form',label:'表单'},{key:'table',label:'ZTable'},{key:'feedback',label:'反馈'},{key:'nav',label:'导航'},
        {key:'hero',label:'ZHero'},{key:'llm-config',label:'ZLLMConfig'},{key:'embedding-config',label:'ZEmbeddingConfig'},{key:'chat',label:'ZChatWindow'},{key:'streaming',label:'ZStreamingText'},{key:'markdown',label:'ZMarkdown'},{key:'composer',label:'ZChatComposer'},{key:'chatfeedback',label:'ZChatFeedback'},{key:'sources',label:'ZSourceList'},{key:'data',label:'数据'},{key:'metrics',label:'指标'},{key:'layout',label:'布局'}
      ]" :key="item.key" :href="'#'+item.key">{{ item.label }}</a>
  </div></nav>

  <div class="demo-wrapper">
    <!-- Hero -->
    <div class="demo-hero">
      <p class="demo-eyebrow">YánZhù Design System / @zbits/ui</p>
      <h1 class="demo-title">组件库演示</h1>
      <p class="demo-desc">岩筑设计系统 — 面向地下空间所数字化平台的全线产品。氧化铜绿（Patina）作为主强调色，体现精密建造的设计语言。共 29 个可交互组件。</p>
    </div>

    <!-- Stats -->
    <div class="demo-meta">
      <div class="demo-meta-item"><span class="demo-meta-val">29</span><span class="demo-meta-lbl">组件</span></div>
      <div class="demo-meta-item"><span class="demo-meta-val">1</span><span class="demo-meta-lbl">Composable</span></div>
      <div class="demo-meta-item"><span class="demo-meta-val">Vue 3</span><span class="demo-meta-lbl">框架</span></div>
      <div class="demo-meta-item"><span class="demo-meta-val">PC</span><span class="demo-meta-lbl">设计语言</span></div>
    </div>

    <!-- ZButton -->
    <section id="buttons" class="demo-section">
      <p class="demo-section-eyebrow">01</p>
      <h2 class="demo-section-title">ZButton 按钮</h2>
      <p class="demo-section-desc">4 种变体 × 3 种尺寸，支持 loading 态、icon 插槽。</p>
      <div class="demo-grid-2">
        <div class="demo-item">
          <p class="demo-item-title">Variant 变体</p>
          <div class="demo-item-body">
            <ZButton variant="primary">主要按钮</ZButton>
            <ZButton variant="secondary">次要按钮</ZButton>
            <ZButton variant="ghost">幽灵按钮</ZButton>
            <ZButton variant="danger">危险按钮</ZButton>
          </div>
        </div>
        <div class="demo-item">
          <p class="demo-item-title">Size 尺寸 × State 状态</p>
          <div class="demo-item-body">
            <ZButton size="sm">小号</ZButton>
            <ZButton size="md">中号</ZButton>
            <ZButton size="lg">大号</ZButton>
            <ZButton disabled>禁用</ZButton>
            <ZButton loading>加载中</ZButton>
          </div>
        </div>
      </div>
    </section>

    <!-- ZBadge + ZTag -->
    <section id="badge" class="demo-section">
      <p class="demo-section-eyebrow">02</p>
      <h2 class="demo-section-title">ZBadge 徽标 / ZTag 标签</h2>
      <p class="demo-section-desc">6 种颜色变体，支持圆点模式；标签可关闭。</p>
      <div class="demo-grid-2">
        <div class="demo-item">
          <p class="demo-item-title">ZBadge 变体</p>
          <div class="demo-item-body">
            <ZBadge variant="default">默认</ZBadge>
            <ZBadge variant="accent">强调</ZBadge>
            <ZBadge variant="amber">琥珀</ZBadge>
            <ZBadge variant="success">成功</ZBadge>
            <ZBadge variant="warning">警告</ZBadge>
            <ZBadge variant="error">错误</ZBadge>
            <ZBadge variant="success" dot>圆点</ZBadge>
          </div>
        </div>
        <div class="demo-item">
          <p class="demo-item-title">ZTag 标签</p>
          <div class="demo-item-body">
            <ZTag>默认标签</ZTag>
            <ZTag>资料包</ZTag>
            <ZTag closable @close="addToast('标签已关闭','info')">可关闭</ZTag>
          </div>
        </div>
      </div>
    </section>

    <!-- ZCard -->
    <section id="card" class="demo-section">
      <p class="demo-section-eyebrow">03</p>
      <h2 class="demo-section-title">ZCard 卡片</h2>
      <p class="demo-section-desc">header / body / footer 三段式，支持 hover 变色、muted 变体、动态 padding。</p>
      <div class="demo-grid-3">
        <ZCard>
          <template #header><strong>基础卡片</strong><ZBadge variant="accent">default</ZBadge></template>
          这是卡片内容区域，可放置任意内容。
          <template #footer><small style="color:var(--text-tertiary)">卡片底部</small></template>
        </ZCard>
        <ZCard hover>
          <template #header><strong>Hover 卡片</strong><ZBadge variant="success">hover</ZBadge></template>
          鼠标悬停时边框变色，适合可点击的卡片。
          <template #footer><small style="color:var(--text-tertiary)">hover: border-accent</small></template>
        </ZCard>
        <ZCard muted>
          <template #header><strong>Muted 卡片</strong><ZBadge variant="amber">muted</ZBadge></template>
          使用次要底色，用于层级较低的辅助面板。
        </ZCard>
      </div>
    </section>

    <!-- ZModal -->
    <section id="modal" class="demo-section">
      <p class="demo-section-eyebrow">04</p>
      <h2 class="demo-section-title">ZModal 模态框 / ZConfirm 确认弹窗</h2>
      <p class="demo-section-desc">Teleport + 过渡动画。确认弹窗支持 danger 和 loading 态。</p>
      <div class="demo-item-body" style="gap:var(--sp-3);padding:0">
        <ZButton @click="modalVis=true">打开模态框</ZButton>
        <ZButton variant="secondary" @click="confirmVis=true">打开确认弹窗</ZButton>
      </div>
      <ZModal :visible="modalVis" title="模态框示例" @close="modalVis=false">
        <p>这是一个 ZModal 组件的演示。内容区域使用 body 插槽。</p>
        <p style="margin-top:var(--sp-3);color:var(--text-secondary)">支持最大宽度自定义、自定义 footer。</p>
        <template #footer>
          <ZButton variant="secondary" @click="modalVis=false">取消</ZButton>
          <ZButton @click="modalVis=false;addToast('操作已确认','success')">确认</ZButton>
        </template>
      </ZModal>
      <ZConfirm :visible="confirmVis" title="确认操作" message="确定要执行此操作吗？" @cancel="confirmVis=false" @confirm="confirmVis=false;addToast('已确认','success')" />
    </section>

    <!-- ZTable -->
    <section id="table" class="demo-section">
      <p class="demo-section-eyebrow">05</p>
      <h2 class="demo-section-title">ZTable 数据表格</h2>
      <p class="demo-section-desc">列配置、行 hover 高亮、空数据占位、自定义列插槽。</p>
      <ZTable :columns="tableCols" :data="tableData" />
    </section>

    <!-- ZFormField + ZSelect + ZSearch -->
     <section id="form" class="demo-section">
       <p class="demo-section-eyebrow">06</p>
       <h2 class="demo-section-title">表单组件</h2>
       <p class="demo-section-desc">ZFormField 统一表单行、ZSelect 下拉选择、ZSearch 搜索栏。</p>
       <div class="demo-grid-3">
        <div class="demo-item">
          <p class="demo-item-title">ZFormField 表单行</p>
          <div class="demo-item-body-col">
            <ZFormField label="项目名称" hint="请输入项目名称" />
            <ZFormField label="项目名称" required>…</ZFormField>
            <ZFormField label="项目名称" error="名称不能为空" required>…</ZFormField>
          </div>
        </div>
        <div class="demo-item">
          <p class="demo-item-title">ZSelect 下拉</p>
          <div class="demo-item-body-col">
            <ZSelect :options="selectOpts" placeholder="请选择角色" v-model="selExample" />
            <span class="fss" style="font-size:var(--text-xs);color:var(--text-tertiary)">当前选中：{{ selExample || '未选择' }}</span>
          </div>
        </div>
        <div class="demo-item">
           <p class="demo-item-title">ZSearch 搜索栏</p>
           <div class="demo-item-body-col">
             <ZSearch v-model="searchQ" @search="addToast('搜索: '+$event,'info')" placeholder="搜索项目..." />
           </div>
         </div>
       </div>
     </section>

    <!-- ZAlert + ZToast + ZProgress -->
    <section id="feedback" class="demo-section">
      <p class="demo-section-eyebrow">07</p>
      <h2 class="demo-section-title">反馈组件</h2>
      <p class="demo-section-desc">ZAlert 消息条、ZToast 通知、ZProgress 进度条、ZSpinner 加载动画。</p>
      <div class="demo-item" style="margin-bottom:var(--sp-4)">
        <p class="demo-item-title">ZAlert 消息条</p>
        <div class="demo-item-body-col">
          <ZAlert v-if="showAlert" type="info" closable @close="showAlert=false">这是一条提示消息</ZAlert>
          <ZAlert type="success">操作成功！已保存。</ZAlert>
          <ZAlert type="warning">部分字段未填写。</ZAlert>
          <ZAlert type="error">网络异常，请重试。</ZAlert>
          <ZButton size="sm" @click="showAlert=true" v-if="!showAlert">恢复 info 提示</ZButton>
        </div>
      </div>
      <div class="demo-grid-3">
        <div class="demo-item">
          <p class="demo-item-title">ZToast 通知</p>
          <div class="demo-item-body-col">
            <ZButton size="sm" @click="addToast('这是一条信息','info')">Info</ZButton>
            <ZButton size="sm" variant="secondary" @click="addToast('操作成功!','success')">Success</ZButton>
            <ZButton size="sm" variant="secondary" @click="addToast('警告提示','warning')">Warning</ZButton>
            <ZButton size="sm" variant="danger" @click="addToast('出错了!','error')">Error</ZButton>
          </div>
        </div>
        <div class="demo-item">
          <p class="demo-item-title">ZProgress 进度条</p>
          <div class="demo-item-body-col">
            <p style="font-size:var(--text-xs);color:var(--text-tertiary);margin-bottom:var(--sp-2)">确定进度 60%</p>
            <ZProgress :percent="60" />
            <p style="font-size:var(--text-xs);color:var(--text-tertiary);margin:var(--sp-2) 0 0">不确定进度（动画）</p>
            <ZProgress />
          </div>
        </div>
        <div class="demo-item">
          <p class="demo-item-title">ZSpinner 加载圈</p>
          <div class="demo-item-body">
            <ZSpinner size="sm" />
            <ZSpinner size="md" />
            <ZSpinner size="lg" />
          </div>
        </div>
      </div>
    </section>

    <!-- ZStepper + ZPagination -->
    <section id="nav" class="demo-section">
      <p class="demo-section-eyebrow">08</p>
      <h2 class="demo-section-title">导航 / 分页组件</h2>
      <p class="demo-section-desc">ZStepper 步骤条（圆+线+标签）、ZPagination 分页（折叠省略号）。</p>
      <div class="demo-item" style="margin-bottom:var(--sp-4)">
        <p class="demo-item-title">ZStepper 步骤条 — 当前第 {{ stepCur }} 步</p>
        <div class="demo-item-body-col">
          <ZStepper :steps="steps" :current="stepCur" />
          <div class="demo-item-body">
            <ZButton size="sm" @click="stepCur = Math.max(0,stepCur-1)" :disabled="stepCur===0">上一步</ZButton>
            <ZButton size="sm" variant="secondary" @click="stepCur = Math.min(steps.length,stepCur+1)" :disabled="stepCur>=steps.length">下一步</ZButton>
            <span style="font-size:var(--text-xs);color:var(--text-tertiary)" v-if="stepCur===steps.length">全部完成!</span>
          </div>
        </div>
      </div>
      <div class="demo-item">
        <p class="demo-item-title">ZPagination 分页</p>
        <ZPagination :current="pagCur" :total="pagTotal" @update:current="pagCur=$event" />
      </div>
    </section>

    <!-- ZHero -->
    <section id="hero" class="demo-section">
      <p class="demo-section-eyebrow">09</p>
      <h2 class="demo-section-title">ZHero 通用 Hero 区 / ZSparkline 走势线 / ZMetricBar 指标行</h2>
      <p class="demo-section-desc">源自 RAG 知识库性能指标组件。ZHero 含 eyebrow + title + description + meta chip + 操作区；ZSparkline 展示迷你趋势；ZMetricBar 展示指标行。</p>
      <div class="demo-item" style="margin-bottom:var(--sp-4)">
        <p class="demo-item-title">ZHero 完整示例</p>
        <ZHero eyebrow="RAG 知识库" title="系统性能总览" description="近 7 天知识库检索与 LLM 调用性能指标概览，监控系统运行状态。" :meta="['近7天', 'GPT-4o', '正常']">
          <ZButton size="sm" variant="secondary">刷新</ZButton>
          <ZButton size="sm">查看详情</ZButton>
        </ZHero>
      </div>
      <div class="demo-grid-3">
        <div class="demo-item">
          <p class="demo-item-title">ZSparkline</p>
          <div class="demo-item-body-col">
            <div class="demo-item-body" style="justify-content:center">
              <ZSparkline value="300" max="350" color="var(--accent)" />
              <ZSparkline value="18000" max="25000" color="var(--warning)" />
            </div>
            <p style="font-size:var(--text-xs);color:var(--text-tertiary);margin-top:var(--sp-2)">SVG 迷你走势线，可配置 value/max/color</p>
          </div>
        </div>
        <div class="demo-item">
          <p class="demo-item-title">ZMetricBar 指标行</p>
          <div class="demo-item-body-col">
            <ZMetricBar label="平均 RPM" value="1.234">
              <template #icon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="13" r="7"/><path d="M9 3h6"/></svg></template>
              <template #spark><ZSparkline value="300" max="350" color="var(--accent)" /></template>
            </ZMetricBar>
            <ZMetricBar label="平均 TPM" value="60.000" period="近7天">
              <template #icon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/><path d="M8 4v16"/></svg></template>
              <template #spark><ZSparkline value="18000" max="25000" color="var(--warning)" /></template>
            </ZMetricBar>
          </div>
        </div>
        <div class="demo-item">
          <p class="demo-item-title">ZMetricBar 简约模式</p>
          <div class="demo-item-body-col">
            <ZMetricBar label="调用次数" value="1,234 次">
              <template #icon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1116 0"/><path d="M12 12l4-4"/></svg></template>
            </ZMetricBar>
            <ZMetricBar label="延迟" value="320ms" period="P99">
              <template #icon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></template>
            </ZMetricBar>
          </div>
        </div>
      </div>
    </section>

    <!-- ZLLMConfig -->
    <section id="llm-config" class="demo-section">
      <p class="demo-section-eyebrow">10</p>
      <h2 class="demo-section-title">ZLLMConfig 大语言模型配置</h2>
      <p class="demo-section-desc">LLM 专用配置面板。API Key 显隐、Base URL、模型选择（含刷新按钮）、Temperature / Max Tokens 滑块，测试/保存按钮。</p>
      <div class="demo-item">
        <ZLLMConfig
          title="LLM 配置演示"
          description="配置大语言模型的连接参数与推理设置。"
          :models="[{id:'qwen-plus',name:'通义千问 Plus'},{id:'gpt-4o',name:'GPT-4o'},{id:'deepseek-v3',name:'DeepSeek V3'}]"
          model="qwen-plus"
          base-url="https://dashscope.aliyuncs.com/compatible-mode/v1"
          api-key="sk-demo-key-xxxx"
          :temperature="0.7"
          :max-tokens="4096"
          @test="addToast('LLM 连接测试演示','info')"
          @save="addToast('LLM 配置已保存','success')"
          @fetch="addToast('请求 LLM 模型列表','info')"
        />
      </div>
    </section>

    <!-- ZEmbeddingConfig -->
    <section id="embedding-config" class="demo-section">
      <p class="demo-section-eyebrow">10a</p>
      <h2 class="demo-section-title">ZEmbeddingConfig 向量模型配置</h2>
      <p class="demo-section-desc">向量模型专用配置面板。API Key 显隐、Base URL、模型选择（含刷新按钮）、向量维度选择，测试/保存按钮。</p>
      <div class="demo-item">
        <ZEmbeddingConfig
          title="向量模型配置演示"
          description="配置文本嵌入模型的连接参数与向量维度。"
          :models="[{id:'text-embedding-v3',name:'通义千问 Embedding V3'},{id:'text-embedding-v2',name:'通义千问 Embedding V2'},{id:'text-embedding-ada-002',name:'OpenAI Ada-002'}]"
          model="text-embedding-v3"
          base-url="https://dashscope.aliyuncs.com/compatible-mode/v1"
          api-key="sk-embedding-key-xxxx"
          :dimensions="1024"
          @test="addToast('Embedding 连接测试演示','info')"
          @save="addToast('Embedding 配置已保存','success')"
          @fetch="addToast('请求向量模型列表','info')"
        />
      </div>
    </section>

    <!-- ZChatWindow -->
    <section id="chat" class="demo-section">
      <p class="demo-section-eyebrow">11</p>

}

}

const ZPagination = {
  name: 'ZPagination',
  props: { current: Number, total: Number, pageSize: { type: Number, default: 20 } },
  emits: ['update:current', 'update:pageSize'],
  template: `
    <div class="pagination">
      <span class="page-info">共 <strong>{{ total }}</strong> 条</span>
      <div class="page-ctrls">
        <button :disabled="current<=1" class="page-btn" @click="go(current-1)">‹</button>
        <template v-for="p in pages" :key="p">
          <span v-if="p==='...'" class="page-ell">...</span>
          <button v-else :class="['page-btn',{active:p===current}]" @click="go(p)">{{ p }}</button>
        </template>
        <button :disabled="current>=last" class="page-btn" @click="go(current+1)">›</button>
      </div>
    </div>`,
  computed: {
    last() { return Math.max(1, Math.ceil(this.total/this.pageSize)) },
    pages() {
      const lp = this.last, c = this.current
      if (lp <= 7) return Array.from({length: lp}, (_,i) => i+1)
      const r = [1]
      if (c > 3) r.push('...')
      for (let i = Math.max(2,c-1); i <= Math.min(lp-1,c+1); i++) r.push(i)
      if (c < lp-2) r.push('...')
      r.push(lp)
      return r
    }
  },
  methods: { go(p) { if (p>=1 && p<=this.last) this.$emit('update:current', p) } }
}

let chatMarkedRenderer = null
let chatMathRenderer = null
let chatRichTextReady = false

function ensureChatRichTextRuntime() {
  if (chatRichTextReady) return
  if (typeof marked !== 'undefined' && typeof renderMathInElement !== 'undefined') {
    marked.setOptions({ breaks: true, gfm: true })
    chatMarkedRenderer = marked
    chatMathRenderer = renderMathInElement
    chatRichTextReady = true
  }
}

function chatPreprocessAnswer(text) {
  if (!text) return ''
  let processed = text.replace(/\[\n([\s\S]*?)\n\]/g, (_, formula) => '$$\n' + formula.trim() + '\n$$')
  processed = processed.replace(/\[([^\n\[\]]+)\]/g, (_, formula) => {
    if (/\\|\^|_|\{|\}|\(|\)/.test(formula)) return '$$' + formula.trim() + '$$'
    return '[' + formula + ']'
  })
  return processed
}

function chatRenderMarkdown(text) {
  const processed = chatPreprocessAnswer(text)
  if (!chatMarkedRenderer) return escapeHtml(processed).replace(/\n/g, '<br>')
  return chatMarkedRenderer.parse(processed)
}

function chatRenderMath(container) {
  if (!container || !chatMathRenderer) return
  chatMathRenderer(container, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
    ],
    throwOnError: false,
  })
}

function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

const ZStreamingText = {
  name: 'ZStreamingText',
  props: {
    text: { type: String, default: '' },
    complete: { type: Boolean, default: false },
    speed: { type: Number, default: 18 },
    pauseOnPunctuation: { type: Boolean, default: true },
    punctuationDelay: { type: Number, default: 80 },
  },
  emits: ['complete'],
  data() {
    return {
      renderedHtml: '',
      currentIndex: 0,
      intervalId: null,
      isPaused: false,
    }
  },
  computed: {
    displayedRaw() { return this.text || '' }
  },
  watch: {
    text: { handler: 'startStream', immediate: true },
    complete(val) {
      if (val) {
        if (this.intervalId) { clearTimeout(this.intervalId); this.intervalId = null }
        ensureChatRichTextRuntime()
        this.renderedHtml = chatRenderMarkdown(this.text || '')
        this.$nextTick(() => {
          if (this.$refs.content) chatRenderMath(this.$refs.content)
        })
        this.currentIndex = this.text.length
      }
    }
  },
  methods: {
    startStream() {
      if (this.intervalId) { clearTimeout(this.intervalId); this.intervalId = null }
      this.currentIndex = 0
      this.isPaused = false
      ensureChatRichTextRuntime()
      const run = () => {
        if (this.currentIndex >= this.text.length) {
          this.$emit('complete')
          return
        }
        if (this.isPaused) {
          this.intervalId = setTimeout(run, 50)
          return
        }
        this.currentIndex++
        const partial = this.text.slice(0, this.currentIndex)
        this.renderedHtml = chatRenderMarkdown(partial)
        const ch = this.text[this.currentIndex - 1]
        const punc = /[。，！？；：、,.!?;:]/
        const delay = (this.pauseOnPunctuation && punc.test(ch)) ? this.punctuationDelay : this.speed
        this.intervalId = setTimeout(run, delay)
      }
      run()
    },
    togglePause() {
      this.isPaused = !this.isPaused
    }
  },
  beforeUnmount() {
    if (this.intervalId) { clearTimeout(this.intervalId); this.intervalId = null }
  },
  template: `<span class="stx-wrap">
    <span ref="content" class="stx" v-html="renderedHtml"></span>
    <span v-if="!complete && !isPaused" class="stx-cur">|</span>
  </span>`
}

const ZChatComposer = {
  name: 'ZChatComposer',
  props: {
    modelValue: { type: String, default: '' },
    placeholder: { type: String, default: '输入问题，按 Enter 发送，Shift+Enter 换行' },
    disabled: { type: Boolean, default: false },
    loading: { type: Boolean, default: false },
    minRows: { type: Number, default: 1 },
    maxRows: { type: Number, default: 8 },
  },
  emits: ['update:modelValue', 'submit', 'stop'],
  data() {
    return { inputValue: this.modelValue }
  },
  computed: {
    canSend() {
      return this.inputValue.trim().length > 0 && !this.disabled && !this.loading
    }
  },
  watch: {
    modelValue(val) {
      if (val !== this.inputValue) this.inputValue = val
    },
    inputValue(val) {
      this.$emit('update:modelValue', val)
      this.$nextTick(() => this.autoResize())
    }
  },
  methods: {
    autoResize() {
      const el = this.$refs.textarea
      if (!el) return
      el.style.height = 'auto'
      const lineHeight = 24
      const minH = lineHeight * this.minRows
      const maxH = lineHeight * this.maxRows
      el.style.height = Math.min(Math.max(el.scrollHeight, minH), maxH) + 'px'
    },
    handleEnter(e) {
      if (this.canSend) this.handleSubmit()
    },
    handleSubmit() {
      const text = this.inputValue.trim()
      if (!text || this.disabled || this.loading) return
      this.$emit('submit', text)
      this.inputValue = ''
      this.$nextTick(() => {
        if (this.$refs.textarea) this.$refs.textarea.style.height = 'auto'
      })
    }
  },
  template: `
    <div class="composer">
      <div v-if="$slots.header" class="composer-header">
        <slot name="header" />
      </div>
      <form class="composer-form" @submit.prevent="handleSubmit">
        <div class="composer-input-wrap">
          <textarea
            ref="textarea"
            v-model="inputValue"
            class="composer-textarea"
            :placeholder="placeholder"
            :disabled="disabled || loading"
            :rows="minRows"
            @keydown.enter.exact.prevent="handleEnter"
            @input="autoResize"
          ></textarea>
        </div>
        <div class="composer-footer">
          <div class="composer-hints">
            <slot name="hints">
              <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
            </slot>
          </div>
          <div class="composer-actions">
            <button
              v-if="loading"
              type="button"
              class="composer-btn composer-btn-stop"
              @click="$emit('stop')"
            >停止</button>
            <button
              type="submit"
              class="composer-btn composer-btn-send"
              :disabled="!canSend"
            >
              <svg v-if="loading" class="composer-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
              <span v-else>发送</span>
            </button>
          </div>
        </div>
      </form>
      <div v-if="$slots.footer" class="composer-footer-note">
        <slot name="footer" />
      </div>
    </div>`
}
